<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upcoming Events | Wilco Welding</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><style>
:root{--gold:#ffc400;--paper:#f5f6f8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:#172031;font-family:Roboto,Arial,sans-serif}.header{background:#050505;border-bottom:2px solid var(--gold)}.nav{max-width:1400px;margin:auto;min-height:82px;display:flex;align-items:center;gap:28px;padding:0 28px}.brand{font:700 28px/1 Oswald,sans-serif;letter-spacing:.5px;color:#fff;text-decoration:none;white-space:nowrap}.brand span,.links .active,.links a:hover{color:var(--gold)}.links{margin-left:auto;display:flex;align-items:center;gap:25px}.links a{color:#fff;text-decoration:none;font:600 17px Oswald,sans-serif;white-space:nowrap}.hero{background:linear-gradient(105deg,#0b0d10,#252b33);color:#fff;padding:62px 24px}.hero-inner,.content{width:min(1080px,100%);margin:auto}.eyebrow{font:700 16px Oswald,sans-serif;letter-spacing:1px;color:var(--gold)}h1,h2,h3{font-family:Oswald,sans-serif}.hero h1{font-size:clamp(46px,7vw,72px);line-height:.95;margin:8px 0}.hero p{margin:0;color:#d4d8de}.content{padding:48px 24px 76px}.event-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.event-card{background:#fff;border:1px solid #dce1e8;border-left:5px solid var(--gold);padding:23px}.event-date{color:#a87500;font-weight:800;font-size:14px}.event-card h2{font-size:30px;line-height:1.05;margin:8px 0 0}.empty{padding:30px;background:#fff;border:1px solid #dce1e8;color:#5a6370}.footer{padding:28px;background:#050505;color:#fff;text-align:center}.footer a{color:var(--gold)}@media(max-width:850px){.nav{display:block;padding:18px 24px}.links{margin:14px 0 0;gap:14px;flex-wrap:wrap}.event-grid{grid-template-columns:1fr}}
</style></head><body><header class="header"><nav class="nav"><a class="brand" href="index.html">WILCO <span>WELDING</span></a><div class="links"><a href="index.html">HOME</a><a href="welding-program.html">WELDING PROGRAM</a><a href="index.html#resources">STUDENT RESOURCES</a><a href="employers-partners.html">CAREERS &amp; EMPLOYERS</a><a href="blog.html">BLOG</a><a href="index.html#contact">CONTACT</a></div></nav></header><main><section class="hero"><div class="hero-inner"><div class="eyebrow">WILCO WELDING</div><h1>UPCOMING EVENTS</h1><p>Stay up to date with Wilco Welding events, activities, and important dates.</p></div></section><div class="content"><div class="event-grid" id="events"></div><div class="empty" id="empty" hidden>No upcoming events have been added yet.</div></div></main><footer class="footer">© Wilco Welding Program · <a href="index.html">Back to home</a></footer><script>
fetch("content.json",{cache:"no-store"}).then(r=>r.json()).then(data=>{const events=Array.isArray(data.events)?data.events:[];const grid=document.getElementById("events");if(!events.length){document.getElementById("empty").hidden=false;return}events.forEach(event=>{const card=document.createElement("article");card.className="event-card";const date=document.createElement("div");date.className="event-date";date.textContent=event[1]||"";const title=document.createElement("h2");title.textContent=event[0]||"Untitled event";card.append(date,title);grid.append(card)})}).catch(()=>{document.getElementById("empty").hidden=false});
