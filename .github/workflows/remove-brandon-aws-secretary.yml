name: Remove Brandon from AWS secretary

on:
  push:
    paths:
      - '.github/workflows/remove-brandon-aws-secretary.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update AWS committee
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('aws.html')
          s = p.read_text(encoding='utf-8')
          old = '<p><strong>AWS Secretary: Adrel Zepeda </strong> Brandon Larson</p>'
          new = '<p><strong>AWS Secretary:</strong> Adrel Zepeda</p>'
          if old not in s:
              raise SystemExit('AWS secretary target text not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aws.html
          git commit -m "Remove Brandon Larson from AWS secretary"
          git push
