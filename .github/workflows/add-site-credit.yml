name: Add site credit

on:
  push:
    paths:
      - '.github/workflows/add-site-credit.yml'

permissions:
  contents: write

jobs:
  add-credit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add credit to every public page
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = [
              'index.html',
              'welding-program.html',
              'student-resources.html',
              'aws.html',
              'wilco-area-career-center.html',
              'employers-partners.html',
              'blog.html',
              'blog-archive.html',
              'events.html',
              'contact.html',
              'syllabi.html',
          ]
          credit = '<div class="site-credit" style="text-align:center;padding:12px 16px 18px;font-size:12px;color:#6b7280;">All work and design was made by Evan Margalus</div>'
          for name in pages:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if 'All work and design was made by Evan Margalus' in text:
                  continue
              if '</body>' not in text:
                  raise SystemExit(f'</body> not found in {name}')
              text = text.replace('</body>', credit + '\n</body>', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html welding-program.html student-resources.html aws.html wilco-area-career-center.html employers-partners.html blog.html blog-archive.html events.html contact.html syllabi.html
          git commit -m "Add Evan Margalus site credit to every page"
          git push
