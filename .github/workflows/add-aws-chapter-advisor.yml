name: Add AWS chapter advisor

on:
  push:
    paths:
      - '.github/workflows/add-aws-chapter-advisor.yml'

permissions:
  contents: write

jobs:
  update-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add chapter advisor above committee members
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('aws.html')
          text = path.read_text(encoding='utf-8')
          old = '<section class="chapter-committee"><h2>2026–2027 AWS STUDENT CHAPTER COMMITTEE</h2><div class="committee-list"><p><strong>AWS Chair:</strong> Anthony Campos</p>'
          new = '<section class="chapter-committee"><h2>2026–2027 AWS STUDENT CHAPTER COMMITTEE</h2><div class="committee-list"><p><strong>Chapter Advisor:</strong> Lisa Moran</p><p><strong>AWS Chair:</strong> Anthony Campos</p>'
          if old not in text:
              raise SystemExit('Committee list marker not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit update
        run: |
          if git diff --quiet -- aws.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aws.html
          git commit -m "Add Lisa Moran as AWS Chapter Advisor"
          git push
