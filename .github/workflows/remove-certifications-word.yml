name: Remove certifications from AWS sentence

on:
  push:
    paths:
      - '.github/workflows/remove-certifications-word.yml'

permissions:
  contents: write

jobs:
  update-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update AWS Student Chapter sentence
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('aws.html')
          text = path.read_text(encoding='utf-8')
          old = 'The Wilco Welding AWS Student Chapter helps students build leadership skills, expand their knowledge of the trade, make industry connections, and learn about scholarships, certifications, careers, and continuing education opportunities in welding.'
          new = 'The Wilco Welding AWS Student Chapter helps students build leadership skills, expand their knowledge of the trade, make industry connections, and learn about scholarships, careers, and continuing education opportunities in welding.'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit update
        run: |
          if git diff --quiet -- aws.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aws.html
          git commit -m "Remove certifications from AWS Student Chapter sentence"
          git push
