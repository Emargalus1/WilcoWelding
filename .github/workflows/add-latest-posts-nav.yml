name: Add latest posts navigation
on:
  push:
    paths:
      - '.github/workflows/add-latest-posts-nav.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Latest Posts links
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('.').glob('*.html'):
              if p.name == 'social-feed.html':
                  continue
              s=p.read_text(encoding='utf-8')
              if 'social-feed.html' in s:
                  continue
              candidates=[
                '<a href="blog.html">BLOG</a><a href="contact.html">CONTACT</a>',
                '<a class="active" href="blog.html">BLOG</a><a href="contact.html">CONTACT</a>'
              ]
              changed=False
              for old in candidates:
                  if old in s:
                      active=' class="active"' if 'class="active"' in old else ''
                      repl=old.replace('<a href="contact.html">CONTACT</a>','<a href="social-feed.html">LATEST POSTS</a><a href="contact.html">CONTACT</a>')
                      s=s.replace(old,repl,1)
                      changed=True
                      break
              if p.name=='index.html' and 'VIEW LATEST POSTS' not in s:
                  old='<a class="yellow-button" href="https://www.tiktok.com/@wilco_welding" target="_blank" rel="noopener noreferrer">FOLLOW ON TIKTOK ↗</a>'
                  if old in s:
                      s=s.replace(old,old+'\n      <a class="yellow-button" href="social-feed.html">VIEW LATEST POSTS →</a>',1)
                      changed=True
              if changed:
                  p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.html
          git commit -m "Add Latest Posts page to site navigation"
          git push
