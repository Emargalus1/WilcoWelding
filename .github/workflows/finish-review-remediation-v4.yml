name: Finish review remediation v4
on:
  push:
    paths: ['.github/workflows/finish-review-remediation-v4.yml']
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          admins=['admin.js','hero-admin.js','aws-admin.js','events-admin.js','partners-admin.js','resources-admin.js','wilco-admin.js']
          for name in admins:
              p=Path('api')/name; s=p.read_text(encoding='utf-8')
              s=s.replace('fetch("/content.json"','fetch("/api/update-content"').replace("fetch('/content.json'","fetch('/api/update-content'")
              s=s.replace('const content = await response.json();','const content = await response.json(); window.__contentSha=content.__sha||"";')
              s=s.replace('const content=await response.json();','const content=await response.json();window.__contentSha=content.__sha||"";')
              s=s.replace('const data = await response.json();','const data = await response.json(); window.__contentSha=data.__sha||window.__contentSha||"";')
              s=s.replace('const data=await response.json();','const data=await response.json();window.__contentSha=data.__sha||window.__contentSha||"";')
              s=s.replace('hero=data.hero||{};','window.__contentSha=data.__sha||window.__contentSha||"";hero=data.hero||{};')
              for key in ['blog:nextBlog,blogPosts:nextPosts','events','hero','partners','resources','awsHero','wilco']:
                  s=s.replace('body:JSON.stringify({'+key+'})','body:JSON.stringify({sha:window.__contentSha,'+key+'})')
              s=s.replace('Saved! Your website has been updated.','Saved to GitHub. Vercel is deploying the change.').replace('Saved! The website has been updated.','Saved to GitHub. Vercel is deploying the change.').replace('Saved! The homepage arrows now use your photos.','Saved to GitHub. Vercel is deploying the hero change.')
              s=s.replace('https://www.wilco.k12.il/','https://www.wilco.k12.il.us/')
              p.write_text(s,encoding='utf-8')

          p=Path('api/page-heroes-admin.js'); s=p.read_text(encoding='utf-8')
          s=s.replace('fetch(\\"/content.json\\"','fetch(\\"/api/update-content\\"')
          s=s.replace('body:JSON.stringify({pageHeroes})','body:JSON.stringify({sha:window.__contentSha,pageHeroes})')
          s=s.replace('const content = await response.json();\\n  pageHeroes','const content = await response.json(); window.__contentSha=content.__sha||\\"\\";\\n  pageHeroes')
          s=s.replace('Photo saved! The page will update shortly.','Photo saved to GitHub. Vercel is deploying the change.').replace('Saved! The page will update shortly.','Saved to GitHub. Vercel is deploying the change.')
          p.write_text(s,encoding='utf-8')

          p=Path('api/page-admin.js'); s=p.read_text(encoding='utf-8')
          old='    const value=m[3];\n    const plain=value.replace(/&nbsp;/g," ").trim();'
          if old in s: s=s.replace(old,'    if(/\\bdata-c\\s*=/.test(m[2])) continue;\n    const value=m[3];\n    const plain=value.replace(/&nbsp;/g," ").trim();')
          p.write_text(s,encoding='utf-8')

          p=Path('syllabi.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('VIEW WELDING I SYLLABUS →','REQUEST CURRENT WELDING I SYLLABUS →').replace('VIEW WELDING II SYLLABUS →','REQUEST CURRENT WELDING II SYLLABUS →')
          old='fetch("content.json",{cache:"no-store"}).then(r=>r.ok?r.json():{}).then(content=>{const links=[content.resources?.syllabi?.welding1||"#",content.resources?.syllabi?.welding2||"#"];document.querySelectorAll("[data-syllabus]").forEach((link,index)=>{link.href=links[index];link.setAttribute("aria-disabled",String(links[index]==="#"));})}).catch(()=>{});'
          new='fetch("content.json",{cache:"no-store"}).then(r=>r.ok?r.json():{}).then(content=>{const links=[content.resources?.syllabi?.welding1||"contact.html",content.resources?.syllabi?.welding2||"contact.html"];document.querySelectorAll("[data-syllabus]").forEach((link,index)=>{link.href=links[index];link.removeAttribute("aria-disabled");})}).catch(()=>{document.querySelectorAll("[data-syllabus]").forEach(link=>{link.href="contact.html";link.removeAttribute("aria-disabled")})});'
          if old in s:s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          for p in list(Path('.').glob('*.html'))+[Path('content.json')]:p.write_text(p.read_text(encoding='utf-8').replace('500 Wilco Drive','500 Wilco Blvd.'),encoding='utf-8')
          Path('PUBLISHING.md').write_text('# Wilco Welding publishing and recovery\n\n- Admin saves write to GitHub first; Vercel deployment is separate.\n- If an editor reports a revision conflict, reload instead of retrying a stale form.\n- Before major edits, verify the latest Vercel production deployment is green.\n- If a deployment fails, use Vercel Deploy Logs to identify and fix or revert the failed commit.\n- Use specialized admin screens for fields controlled by `content.json`; use the full-page editor for template-level changes.\n- Image uploads accept JPG, PNG, WebP, and GIF up to 10 MB.\n- Keep `ADMIN_PASSWORD`, `GITHUB_TOKEN`, and Blob credentials only in Vercel environment variables.\n',encoding='utf-8')
          PY
          node --check script.js
          for f in api/*.js lib/*.js; do node --check "$f"; done
          python -m json.tool content.json >/dev/null
          python -m json.tool package.json >/dev/null
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api content.json *.html PUBLISHING.md
          git commit -m "Finish review remediation and publishing safeguards"
          git push
