name: Update AWS committee members

on:
  push:
    paths:
      - '.github/workflows/update-aws-committee-members.yml'

permissions:
  contents: write

jobs:
  update-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update 2026-2027 AWS committee members
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('aws.html')
          text = path.read_text(encoding='utf-8')

          old = '<section class="chapter-committee"><h2>2026–2027 AWS STUDENT CHAPTER COMMITTEE</h2><p>Committee member names and positions will be posted here once the 2026–2027 Wilco Welding AWS Student Chapter committee is finalized.</p></section>'
          new = '''<section class="chapter-committee"><h2>2026–2027 AWS STUDENT CHAPTER COMMITTEE</h2><div class="committee-list"><p><strong>AWS Chair:</strong> Anthony Campos</p><p><strong>AWS Vice Chair:</strong> Matt Herrera</p><p><strong>AWS Secretary:</strong> Brandon Larson</p><p><strong>AWS Treasurer:</strong> Mike Basile</p><p><strong>AWS Sponsorship Committee Chair:</strong> Ashley Hobbs</p><p><strong>AWS Sponsorship Committee Vice Chair:</strong> Logan Beutel</p><p><strong>AWS Media Committee Chair:</strong> Rylee Rodriguez</p><p><strong>AWS Media Committee Vice Chair:</strong> Ashley Hobbs</p></div></section>'''

          if old not in text:
              raise SystemExit('Committee placeholder not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit update
        run: |
          if git diff --quiet -- aws.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aws.html
          git commit -m "Add 2026-2027 AWS committee member names and positions"
          git push
