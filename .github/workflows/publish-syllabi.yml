name: Publish syllabi

on:
  push:
    paths:
      - '.github/workflows/publish-syllabi.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and publish syllabus PDFs
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, json

          docs = Path('documents')
          docs.mkdir(exist_ok=True)

          specs = [
              ('wld1', 'WLD-1-Syllabus-2026-2027.pdf'),
              ('wld2', 'WLD-2-Syllabus-2026-2027.pdf'),
          ]
          for prefix, filename in specs:
              parts = sorted(Path('tmp-syllabus').glob(f'{prefix}-*.b64'))
              if len(parts) != 3:
                  raise SystemExit(f'Expected 3 chunks for {prefix}, found {len(parts)}')
              encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
              pdf = gzip.decompress(base64.b64decode(encoded, validate=True))
              if not pdf.startswith(b'%PDF') or b'%%EOF' not in pdf[-1024:]:
                  raise SystemExit(f'{filename} failed PDF validation')
              (docs / filename).write_bytes(pdf)
              print(filename, len(pdf), 'bytes')

          p = Path('content.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          syllabi = data.setdefault('resources', {}).setdefault('syllabi', {})
          syllabi['welding1'] = '/documents/WLD-1-Syllabus-2026-2027.pdf'
          syllabi['welding2'] = '/documents/WLD-2-Syllabus-2026-2027.pdf'
          p.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          p = Path('syllabi.html')
          html = p.read_text(encoding='utf-8')
          html = html.replace('Select your course below to access its syllabus when it becomes available.', 'Select your course below to view the current 2026–2027 syllabus.')
          html = html.replace('REQUEST CURRENT WELDING I SYLLABUS →', 'VIEW WELDING I SYLLABUS →')
          html = html.replace('REQUEST CURRENT WELDING II SYLLABUS →', 'VIEW WELDING II SYLLABUS →')
          p.write_text(html, encoding='utf-8')
          PY

      - name: Commit syllabus files and links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add documents/WLD-1-Syllabus-2026-2027.pdf documents/WLD-2-Syllabus-2026-2027.pdf content.json syllabi.html
          git commit -m "Publish 2026-2027 WLD-1 and WLD-2 syllabi"
          git push
