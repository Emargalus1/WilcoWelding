name: Add AWS Student Chapter section

on:
  push:
    paths:
      - '.github/workflows/add-aws-student-chapter-section.yml'

permissions:
  contents: write

jobs:
  update-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add student chapter section
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('aws.html')
          text = path.read_text(encoding='utf-8')

          old_css = ".lead{max-width:760px;font-size:18px;line-height:1.65;color:#4b5563;margin:0 0 32px}"
          new_css = old_css + ".student-chapter{max-width:880px;background:#fff;border:1px solid #e0e5eb;border-left:5px solid var(--gold);border-radius:9px;padding:30px;margin:0 0 34px}.student-chapter h2{font-size:34px;margin:0 0 10px}.student-chapter p{margin:0 0 16px;color:#4b5563;line-height:1.65}.student-chapter p:last-child{margin-bottom:0}.student-chapter strong{color:var(--ink)}"
          if old_css in text and ".student-chapter{" not in text:
              text = text.replace(old_css, new_css, 1)

          old = '<p class="lead">The AWS Student Chapter gives Wilco Welding students another way to build their welding knowledge, connect with the trade, and prepare for future opportunities.</p>'
          new = '''<section class="student-chapter"><h2>WHAT IS AN AWS STUDENT CHAPTER?</h2><p>An AWS Student Chapter is a school-based organization connected to the <strong>American Welding Society</strong>. It gives students opportunities to learn more about the welding industry beyond the classroom and become involved in the professional welding community.</p><p>Through the chapter, students can take part in activities such as industry presentations, shop tours, welding demonstrations, career exploration, community projects, competitions, and networking with welding professionals and employers.</p><p>The Wilco Welding AWS Student Chapter helps students build leadership skills, expand their knowledge of the trade, make industry connections, and learn about scholarships, certifications, careers, and continuing education opportunities in welding.</p></section>'''

          if old in text:
              text = text.replace(old, new, 1)
          elif 'WHAT IS AN AWS STUDENT CHAPTER?' not in text:
              marker = '<section class="aws-news">'
              text = text.replace(marker, new + marker, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit update
        run: |
          if git diff --quiet -- aws.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aws.html
          git commit -m "Add AWS Student Chapter overview section"
          git push
