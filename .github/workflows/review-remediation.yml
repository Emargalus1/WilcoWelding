name: Review remediation

on:
  push:
    paths:
      - '.github/workflows/review-remediation.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply review fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          def patch(path, old, new, count=1):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'missing target in {path}: {old[:80]!r}')
              p.write_text(s.replace(old,new,count),encoding='utf-8')

          # Full-page editor: bind filename/content/revision, disable save after failed/switching loads,
          # and never classify executable script sources as pictures.
          p=Path('api/page-admin.js'); s=p.read_text(encoding='utf-8')
          s=s.replace('let originalHtml = "";\nlet textItems = [];', 'let originalHtml = "";\nlet loadedPage = "";\nlet loadedSha = "";\nlet loadOk = false;\nlet textItems = [];')
          s=s.replace('const attrRegex=/(?:src|poster)\\s*=\\s*(["\'])(.*?)\\1/gi;', 'const attrRegex=/(?:<img\\b[^>]*\\bsrc|<source\\b[^>]*\\bsrc|<video\\b[^>]*\\bposter)\\s*=\\s*(["\'])(.*?)\\1/gi;')
          s=s.replace('setStatus("Loading "+page+"…");', 'loadOk=false; loadedPage=""; loadedSha=""; $("save").disabled=true; setStatus("Loading "+page+"…");')
          s=s.replace('originalHtml=data.html; $("html").value=data.html; extractQuickFields();\n    setStatus("Loaded "+page+". Edit text or pictures, then save.","success");', 'originalHtml=data.html; loadedPage=data.page; loadedSha=data.sha; loadOk=true; $("html").value=data.html; extractQuickFields(); $("save").disabled=false;\n    setStatus("Loaded "+page+". Edit text or pictures, then save.","success");')
          s=s.replace('$("save").addEventListener("click",async()=>{\n  const btn=$("save");btn.disabled=true;applyQuickChanges();setStatus("Saving "+pageSelect.value+"…");', '$("save").addEventListener("click",async()=>{\n  const btn=$("save"); if(!loadOk || !loadedSha || loadedPage!==pageSelect.value) return setStatus("Reload this page before saving. The selected page is not the successfully loaded page.","error"); btn.disabled=true;applyQuickChanges();setStatus("Saving "+loadedPage+"…");')
          s=s.replace('body:JSON.stringify({page:pageSelect.value,html:$("html").value})', 'body:JSON.stringify({page:loadedPage,html:$("html").value,sha:loadedSha})')
          s=s.replace('if(!r.ok)throw new Error(data.error||"Could not save page.");\n    originalHtml=$("html").value;', 'if(!r.ok)throw new Error(data.error||"Could not save page.");\n    loadedSha=data.sha||loadedSha; originalHtml=$("html").value;')
          p.write_text(s,encoding='utf-8')

          # Blog admin: require successful load, avoid duplicate/lost retries, render titles as text.
          p=Path('api/admin.js'); s=p.read_text(encoding='utf-8')
          s=s.replace('let creatingNew = false;', 'let creatingNew = false;\n    let loadedOk = false;\n    get("save").disabled = true;')
          old='''      list.innerHTML = previous.length\n        ? previous.map((post, index) => '<div class="history-item"><b>' + (post.title || "Untitled post") + '</b><span>Previous post ' + (index + 1) + '</span></div>').join("")\n        : '<div class="history-item"><span>No previous posts yet. New posts will be saved here automatically.</span></div>';'''
          new='''      list.replaceChildren();\n      if (!previous.length) {\n        const item=document.createElement("div"); item.className="history-item";\n        const span=document.createElement("span"); span.textContent="No previous posts yet. New posts will be saved here automatically."; item.appendChild(span); list.appendChild(item); return;\n      }\n      previous.forEach((post,index)=>{\n        const item=document.createElement("div"); item.className="history-item";\n        const b=document.createElement("b"); b.textContent=post.title||"Untitled post";\n        const span=document.createElement("span"); span.textContent="Previous post "+(index+1);\n        item.append(b,span); list.appendChild(item);\n      });'''
          if old not in s: raise SystemExit('admin renderHistory target missing')
          s=s.replace(old,new)
          s=s.replace('renderHistory();\n        setStatus("Current post loaded.","success");', 'renderHistory(); loadedOk=true; get("save").disabled=false;\n        setStatus("Current post loaded.","success");')
          s=s.replace('get("newPost").addEventListener("click", () => {\n      creatingNew = true;', 'get("newPost").addEventListener("click", () => {\n      if(!loadedOk) return setStatus("Wait for the current posts to load before creating a post.","error");\n      creatingNew = true;')
          old='''      const button = get("save"); button.disabled = true;\n      blog = readForm();\n      if (creatingNew) {\n        blogPosts = [blog, ...blogPosts];\n      } else {\n        blogPosts = [blog, ...blogPosts.slice(1)];\n      }\n      setStatus("Saving changes…");\n      try {\n        const response = await fetch("/api/update-content",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({blog,blogPosts})});'''
          new='''      const button = get("save");\n      if(!loadedOk) return setStatus("The current post history did not load. Reload before saving.","error");\n      button.disabled = true;\n      const nextBlog = readForm();\n      const nextPosts = creatingNew ? [nextBlog, ...blogPosts] : [nextBlog, ...blogPosts.slice(1)];\n      setStatus("Saving changes…");\n      try {\n        const response = await fetch("/api/update-content",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({blog:nextBlog,blogPosts:nextPosts})});'''
          if old not in s: raise SystemExit('admin save target missing')
          s=s.replace(old,new)
          s=s.replace('creatingNew = false;\n        renderHistory();', 'blog=nextBlog; blogPosts=nextPosts; creatingNew = false;\n        renderHistory();')
          p.write_text(s,encoding='utf-8')

          # Content: current year and honest resource language while documents are unavailable.
          p=Path('content.json'); data=json.loads(p.read_text(encoding='utf-8'))
          data.setdefault('footer',{})['copyright']='© 2026 Wilco Welding Program. All Rights Reserved.'
          cards=data.get('resources',{}).get('cards',[])
          if len(cards)>=2:
              cards[1]['description']='Supply requirements vary by class. Contact Wilco Welding for the current approved supply list.'
              cards[1]['action']='CONTACT FOR CURRENT SUPPLY LIST →'
              cards[1]['link']='contact.html'
          if len(cards)>=3:
              cards[2]['description']='Contact Wilco Welding for current recommendations on welding gear, protective clothing, tools, and class equipment.'
              cards[2]['action']='CONTACT FOR GEAR RECOMMENDATIONS →'
              cards[2]['link']='contact.html'
          p.write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')

          # Shared responsive/accessibility fixes.
          p=Path('styles.css'); s=p.read_text(encoding='utf-8')
          s=s.replace('.gold-link{position:absolute;bottom:10px;left:20px;color:#b78100;', '.gold-link{position:absolute;bottom:10px;left:20px;color:#7a5700;')
          s=s.replace('.eventrow small{font-size:11px}', '.eventrow small{font-size:12px;color:#4b4b4b}')
          s += '''\n/* Review remediation: tablet navigation, phone carousel controls, focus, and contrast */\n:focus-visible{outline:3px solid #8a5f00;outline-offset:3px}\n.site-credit{color:#505050!important}\n@media(max-width:1180px){\n  .header{height:70px}.logo{width:210px;height:70px}.logo img{width:190px;height:66px}\n  .hamburger{display:block;margin-left:auto;background:none;border:0;color:#fff;font-size:28px;padding:15px;cursor:pointer}\n  .header-inner{padding-right:10px;position:relative}\n  nav{display:none;position:absolute;top:70px;left:0;right:0;background:#050505;flex-direction:column;align-items:stretch;padding:10px 20px;z-index:60;max-height:calc(100vh - 70px);overflow:auto}\n  nav.open{display:flex}nav a{height:45px;font-size:16px}\n}\n@media(max-width:520px){\n  .hero{height:auto;min-height:535px;padding-bottom:64px}\n  .hero-text{padding:72px 38px 20px}.hero p{width:auto;max-width:100%}\n  .hero .arrow{top:auto;bottom:12px;transform:none;font-size:42px;background:rgba(0,0,0,.58);width:48px;height:48px;border-radius:50%}\n  .hero .arrow.left{left:calc(50% - 62px)}.hero .arrow.right{right:calc(50% - 62px)}\n  .slider-dots{justify-content:center}\n}\n'''
          p.write_text(s,encoding='utf-8')

          # Add descriptions/canonical URLs and improve control markup across all public pages.
          pages=['index.html','welding-program.html','student-resources.html','aws.html','wilco-area-career-center.html','employers-partners.html','blog.html','blog-archive.html','events.html','contact.html','syllabi.html']
          descriptions={
            'index.html':'Wilco Welding Program information, student resources, events, AWS Student Chapter news, and industry partnerships.',
            'welding-program.html':'Explore the Wilco Welding Program, hands-on training, safety, welding processes, and career preparation.',
            'student-resources.html':'Student resources for the Wilco Welding Program, including course documents, supplies, and gear information.',
            'aws.html':'Learn about the Wilco Welding AWS Student Chapter, leadership, scholarships, and student opportunities.',
            'wilco-area-career-center.html':'Learn about Wilco Area Career Center and career-technical education opportunities for students.',
            'employers-partners.html':'Wilco Welding employers, industry partners, unions, colleges, and workforce connections.',
            'blog.html':'Latest Wilco Welding news, student chapter updates, program announcements, and events.',
            'blog-archive.html':'Archive of Wilco Welding news and program updates.',
            'events.html':'Upcoming Wilco Welding events, activities, and important dates.',
            'contact.html':'Contact the Wilco Welding Program at Wilco Area Career Center in Romeoville, Illinois.',
            'syllabi.html':'Wilco Welding syllabus and course-document availability information.'
          }
          for name in pages:
              p=Path(name); h=p.read_text(encoding='utf-8')
              if '<meta name="description"' not in h:
                  h=h.replace('</title>', '</title>\n<meta name="description" content="'+descriptions[name]+'">\n<link rel="canonical" href="https://www.wilcowelding.org/'+('' if name=='index.html' else name)+'">',1)
              h=re.sub(r'<button([^>]*class="[^"]*hamburger[^"]*"[^>]*)>', lambda m:'<button'+m.group(1)+' aria-label="Open navigation menu" aria-expanded="false">' if 'aria-label=' not in m.group(1) else m.group(0), h)
              h=re.sub(r'<button([^>]*class="[^"]*arrow left[^"]*"[^>]*)>', lambda m:'<button'+m.group(1)+' aria-label="Previous hero photo">' if 'aria-label=' not in m.group(1) else m.group(0), h)
              h=re.sub(r'<button([^>]*class="[^"]*arrow right[^"]*"[^>]*)>', lambda m:'<button'+m.group(1)+' aria-label="Next hero photo">' if 'aria-label=' not in m.group(1) else m.group(0), h)
              p.write_text(h,encoding='utf-8')

          # robots + sitemap for the connected production domain.
          Path('robots.txt').write_text('User-agent: *\nAllow: /\nSitemap: https://www.wilcowelding.org/sitemap.xml\n',encoding='utf-8')
          urls=['https://www.wilcowelding.org/']+[f'https://www.wilcowelding.org/{x}' for x in pages if x!='index.html']
          Path('sitemap.xml').write_text('<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'+'\n'.join(f'  <url><loc>{u}</loc></url>' for u in urls)+'\n</urlset>\n',encoding='utf-8')
          PY

      - name: Syntax checks
        run: |
          node --check script.js
          for f in api/*.js lib/*.js; do node --check "$f"; done
          python -m json.tool content.json >/dev/null
          python -m json.tool package.json >/dev/null

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/admin.js api/page-admin.js content.json styles.css index.html welding-program.html student-resources.html aws.html wilco-area-career-center.html employers-partners.html blog.html blog-archive.html events.html contact.html syllabi.html robots.txt sitemap.xml
          git commit -m "Fix review security quality and publishing issues"
          git push
