name: Remove AWS information section

on:
  push:
    paths:
      - '.github/workflows/remove-aws-info.yml'

permissions:
  contents: write

jobs:
  remove-section:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove bottom AWS information section
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('aws.html')
          text = path.read_text(encoding='utf-8')
          start_marker = '<section class="notice"><h2>INFORMATION</h2>'
          start = text.find(start_marker)
          if start == -1:
              print('AWS information section is already removed.')
              raise SystemExit(0)

          end = text.find('</section>', start)
          if end == -1:
              raise SystemExit('Could not find the end of the AWS information section.')

          end += len('</section>')
          text = text[:start] + text[end:]
          path.write_text(text, encoding='utf-8')
          print('Removed AWS information section.')
          PY

      - name: Commit change
        run: |
          if git diff --quiet -- aws.html; then
            echo "No AWS page change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aws.html
          git commit -m "Remove bottom information from AWS page"
          git push
