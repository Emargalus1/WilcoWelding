name: Fix TikTok links
on:
  push:
    paths:
      - '.github/workflows/fix-tiktok-links.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize TikTok profile links
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              s=s.replace('https://www.tiktok.com/@Wilco_Welding','https://www.tiktok.com/@wilco_welding')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.html
          git commit -m "Fix TikTok profile links"
          git push
