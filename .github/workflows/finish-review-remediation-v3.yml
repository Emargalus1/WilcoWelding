name: Finish review remediation v3

on:
  push:
    paths:
      - '.github/workflows/finish-review-remediation-v3.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply remaining fixes safely
        run: |
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path

          # Editors using template literals: load authenticated content and save against its revision.
          admins=['admin.js','hero-admin.js','aws-admin.js','events-admin.js','partners-admin.js','resources-admin.js','wilco-admin.js']
          for name in admins:
              p=Path('api')/name
              s=p.read_text(encoding='utf-8')
              s=s.replace('fetch("/content.json"', 'fetch("/api/update-content"').replace("fetch('/content.json'", "fetch('/api/update-content'")
              s=s.replace('const content = await response.json();', 'const content = await response.json(); window.__contentSha=content.__sha||"";')
              s=s.replace('const content=await response.json();', 'const content=await response.json();window.__contentSha=content.__sha||"";')
              s=s.replace('const data = await response.json();', 'const data = await response.json(); window.__contentSha=data.__sha||window.__contentSha||"";')
              s=s.replace('const data=await response.json();', 'const data=await response.json();window.__contentSha=data.__sha||window.__contentSha||"";')
              s=s.replace('hero=data.hero||{};', 'window.__contentSha=data.__sha||window.__contentSha||"";hero=data.hero||{};')
              for key in ['blog:nextBlog,blogPosts:nextPosts','events','hero','partners','resources','awsHero','wilco']:
                  s=s.replace('body:JSON.stringify({'+key+'})','body:JSON.stringify({sha:window.__contentSha,'+key+'})')
              s=s.replace('Saved! Your website has been updated.', 'Saved to GitHub. Vercel is deploying the change.')
              s=s.replace('Saved! The website has been updated.', 'Saved to GitHub. Vercel is deploying the change.')
              s=s.replace('Saved! The homepage arrows now use your photos.', 'Saved to GitHub. Vercel is deploying the hero change.')
              s=s.replace('https://www.wilco.k12.il/', 'https://www.wilco.k12.il.us/')
              p.write_text(s,encoding='utf-8')

          # page-heroes-admin is one large quoted HTML string, so injected quotes must remain escaped.
          p=Path('api/page-heroes-admin.js'); s=p.read_text(encoding='utf-8')
          s=s.replace('fetch(\\"/content.json\\"', 'fetch(\\"/api/update-content\\"')
          s=s.replace('body:JSON.stringify({pageHeroes})', 'body:JSON.stringify({sha:window.__contentSha,pageHeroes})')
          s=s.replace('const content = await response.json();\\n  pageHeroes', 'const content = await response.json(); window.__contentSha=content.__sha||\\"\\";\\n  pageHeroes')
          s=s.replace('Photo saved! The page will update shortly.', 'Photo saved to GitHub. Vercel is deploying the change.')
          s=s.replace('Saved! The page will update shortly.', 'Saved to GitHub. Vercel is deploying the change.')
          p.write_text(s,encoding='utf-8')

          # Full page editor: dynamic data-c content belongs to structured admins, not HTML quick fields.
          p=Path('api/page-admin.js'); s=p.read_text(encoding='utf-8')
          needle='    const value=m[3];\n    const plain=value.replace(/&nbsp;/g," ").trim();'
          if needle in s:
              s=s.replace(needle,'    if(/\\bdata-c\\s*=/.test(m[2])) continue;\n    const value=m[3];\n    const plain=value.replace(/&nbsp;/g," ").trim();')
          p.write_text(s,encoding='utf-8')

          # Missing syllabi route honestly to contact rather than dead links.
          p=Path('syllabi.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('VIEW WELDING I SYLLABUS →','REQUEST CURRENT WELDING I SYLLABUS →').replace('VIEW WELDING II SYLLABUS →','REQUEST CURRENT WELDING II SYLLABUS →')
          old='fetch("content.json",{cache:"no-store"}).then(r=>r.ok?r.json():{}).then(content=>{const links=[content.resources?.syllabi?.welding1||"#",content.resources?.syllabi?.welding2||"#"];document.querySelectorAll("[data-syllabus]").forEach((link,index)=>{link.href=links[index];link.setAttribute("aria-disabled",String(links[index]==="#"));})}).catch(()=>{});'
          new='fetch("content.json",{cache:"no-store"}).then(r=>r.ok?r.json():{}).then(content=>{const links=[content.resources?.syllabi?.welding1||"contact.html",content.resources?.syllabi?.welding2||"contact.html"];document.querySelectorAll("[data-syllabus]").forEach((link,index)=>{link.href=links[index];link.removeAttribute("aria-disabled");})}).catch(()=>{document.querySelectorAll("[data-syllabus]").forEach(link=>{link.href="contact.html";link.removeAttribute("aria-disabled")})});'
          if old in s: s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          # Align address wording with Wilco's current public listing.
          for p in list(Path('.').glob('*.html'))+[Path('content.json')]:
              p.write_text(p.read_text(encoding='utf-8').replace('500 Wilco Drive','500 Wilco Blvd.'),encoding='utf-8')

          # Permanent syntax CI and publishing/recovery guidance.
          Path('.github/workflows/validate.yml').write_text('''name: Validate site\non:\n  push:\n    branches: [main]\n  pull_request:\npermissions:\n  contents: read\njobs:\n  validate:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n      - run: node --check script.js\n      - run: for f in api/*.js lib/*.js; do node --check "$f"; done\n      - run: python -m json.tool content.json >/dev/null\n      - run: python -m json.tool package.json >/dev/null\n''',encoding='utf-8')
          Path('PUBLISHING.md').write_text('''# Wilco Welding publishing and recovery\n\n- Admin saves write to GitHub first. A successful admin message means the repository save completed; Vercel deployment is a separate step.\n- If an editor reports a revision conflict, reload instead of retrying the stale form.\n- Before major edits, verify the latest Vercel production deployment is green.\n- If a deployment fails, use Vercel Deploy Logs to identify the failed commit and fix or revert that commit in GitHub.\n- The full-page editor is for template-level changes. Fields controlled by `content.json` should be changed through specialized admin screens.\n- Image uploads allow JPG, PNG, WebP, and GIF up to 10 MB.\n- Keep `ADMIN_PASSWORD`, `GITHUB_TOKEN`, and Blob credentials only in Vercel environment variables.\n''',encoding='utf-8')
          PY

          node --check script.js
          for f in api/*.js lib/*.js; do node --check "$f"; done
          python -m json.tool content.json >/dev/null
          python -m json.tool package.json >/dev/null

      - name: Commit final fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api content.json *.html PUBLISHING.md .github/workflows/validate.yml
          git commit -m "Finish review remediation and add release safeguards"
          git push
