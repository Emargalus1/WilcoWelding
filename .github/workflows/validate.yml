name: Validate site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check script.js
      - run: for f in api/*.js lib/*.js; do node --check "$f"; done
      - run: python -m json.tool content.json >/dev/null
      - run: python -m json.tool package.json >/dev/null
