name: Add social media links
on:
  push:
    paths:
      - '.github/workflows/add-social-media.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Instagram and TikTok links
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = [
            "index.html","welding-program.html","student-resources.html","aws.html",
            "wilco-area-career-center.html","employers-partners.html","blog.html",
            "blog-archive.html","events.html","contact.html","syllabi.html"
          ]

          social = '''<div class="social-links" aria-label="Wilco Welding social media">
        <a href="https://www.instagram.com/Wilco_Welding/" target="_blank" rel="noopener noreferrer" aria-label="Wilco Welding on Instagram">Instagram</a>
        <a href="https://www.tiktok.com/@Wilco_Welding" target="_blank" rel="noopener noreferrer" aria-label="Wilco Welding on TikTok">TikTok</a>
      </div>'''

          for name in pages:
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding="utf-8")
              if '<div class="social">●　◎　✉</div>' in s:
                  s = s.replace('<div class="social">●　◎　✉</div>', social)
              elif 'class="social-links"' not in s:
                  # Do not guess alternate footer structures.
                  print(f"Footer social placeholder not found in {name}")
              p.write_text(s, encoding="utf-8")

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          if 'class="home-social"' not in s:
              block = '''
<section class="home-social" aria-labelledby="social-heading">
  <div class="home-social-inner">
    <p class="yellow">STAY CONNECTED</p>
    <h2 id="social-heading">FOLLOW WILCO WELDING</h2>
    <div class="underline"></div>
    <p>Follow Wilco Welding for student projects, shop updates, AWS Student Chapter news, events, and more.</p>
    <div class="home-social-buttons">
      <a class="yellow-button" href="https://www.instagram.com/Wilco_Welding/" target="_blank" rel="noopener noreferrer">FOLLOW ON INSTAGRAM ↗</a>
      <a class="yellow-button" href="https://www.tiktok.com/@Wilco_Welding" target="_blank" rel="noopener noreferrer">FOLLOW ON TIKTOK ↗</a>
    </div>
  </div>
</section>
'''
              if "<footer" not in s:
                  raise SystemExit("Homepage footer not found")
              s = s.replace("<footer", block + "<footer", 1)
              p.write_text(s, encoding="utf-8")

          css = Path("styles.css")
          c = css.read_text(encoding="utf-8")
          marker = "/* Wilco Welding social media links */"
          if marker not in c:
              c += '''

/* Wilco Welding social media links */
.social-links{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.social-links a{display:inline-flex;align-items:center;color:#fff;text-decoration:none;font-size:13px;font-weight:700;border-bottom:2px solid transparent;padding:3px 0}
.social-links a:hover,.social-links a:focus-visible{color:var(--yellow);border-bottom-color:var(--yellow)}
.home-social{background:#f5f5f5;padding:34px 20px}
.home-social-inner{max-width:1180px;margin:0 auto;text-align:center}
.home-social .yellow{margin:0 0 4px}
.home-social h2{font-family:Oswald,sans-serif;font-size:31px;margin:0;color:#111}
.home-social .underline{margin:8px auto 14px}
.home-social p:not(.yellow){max-width:700px;margin:0 auto 18px;line-height:1.5;color:#444}
.home-social-buttons{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
@media(max-width:520px){.home-social-buttons{flex-direction:column;align-items:stretch}.home-social-buttons .yellow-button{text-align:center}}
'''
              css.write_text(c, encoding="utf-8")
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.html styles.css
          git commit -m "Add Wilco Welding social media links"
          git push
