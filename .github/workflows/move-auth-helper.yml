name: Move auth helper out of api

on:
  push:
    paths:
      - '.github/workflows/move-auth-helper.yml'

permissions:
  contents: write

jobs:
  move-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move shared auth helper and update imports
        run: |
          mkdir -p lib
          mv api/auth.js lib/auth.js
          python - <<'PY'
          from pathlib import Path
          for path in Path('api').glob('*.js'):
              text = path.read_text(encoding='utf-8')
              new = text.replace('from "./auth.js"', 'from "../lib/auth.js"').replace("from './auth.js'", "from '../lib/auth.js'")
              if new != text:
                  path.write_text(new, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api lib
          git commit -m "Move auth helper out of api to reduce Vercel functions"
          git push
