name: Finish review remediation

on:
  push:
    paths:
      - '.github/workflows/finish-review-remediation.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Finish fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          admins=['admin.js','hero-admin.js','aws-admin.js','events-admin.js','partners-admin.js','resources-admin.js','page-heroes-admin.js','wilco-admin.js']
          for name in admins:
              p=Path('api')/name
              s=p.read_text(encoding='utf-8')
              s=s.replace('fetch("/content.json"', 'fetch("/api/update-content"').replace("fetch('/content.json'", "fetch('/api/update-content'")
              s=s.replace('body:JSON.stringify({', 'body:JSON.stringify({sha:window.__contentSha,')
              # Record the loaded GitHub revision for conflict-safe saves.
              s=s.replace('const content = await response.json();', 'const content = await response.json(); window.__contentSha=content.__sha||"";')
              s=s.replace('const content=await response.json();', 'const content=await response.json();window.__contentSha=content.__sha||"";')
              s=s.replace('hero=data.hero||{};', 'window.__contentSha=data.__sha||"";hero=data.hero||{};')
              s=s.replace('const data=await response.json();', 'const data=await response.json();window.__contentSha=data.__sha||window.__contentSha||"";')
              s=s.replace('const data = await response.json();', 'const data = await response.json(); window.__contentSha=data.__sha||window.__contentSha||"";')
              s=s.replace('Saved! Your website has been updated.', 'Saved to GitHub. Vercel is deploying the change.')
              s=s.replace('Saved! The website has been updated.', 'Saved to GitHub. Vercel is deploying the change.')
              s=s.replace('Saved! The homepage arrows now use your photos.', 'Saved to GitHub. Vercel is deploying the hero change.')
              s=s.replace('https://www.wilco.k12.il/', 'https://www.wilco.k12.il.us/')
              # Reload after a successful save so every next edit starts from the new revision.
              s=s.replace('"success")}catch(error)', '"success");setTimeout(()=>location.reload(),900)}catch(error)')
              s=s.replace('"success") } catch (error)', '"success"); setTimeout(()=>location.reload(),900) } catch (error)')
              p.write_text(s,encoding='utf-8')

          # Full-page quick editor must not present JSON-bound text as if HTML owns it.
          p=Path('api/page-admin.js'); s=p.read_text(encoding='utf-8')
          s=s.replace('const value=m[3];\n    const plain=value.replace', 'if(/\\bdata-c\\s*=/.test(m[2])) continue;\n    const value=m[3];\n    const plain=value.replace')
          p.write_text(s,encoding='utf-8')

          # Make unavailable syllabi an honest contact journey rather than disabled promises.
          p=Path('syllabi.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('VIEW WELDING I SYLLABUS →', 'REQUEST CURRENT WELDING I SYLLABUS →').replace('VIEW WELDING II SYLLABUS →','REQUEST CURRENT WELDING II SYLLABUS →')
          old='''fetch("content.json",{cache:"no-store"}).then(r=>r.ok?r.json():{}).then(content=>{const links=[content.resources?.syllabi?.welding1||"#",content.resources?.syllabi?.welding2||"#"];document.querySelectorAll("[data-syllabus]").forEach((link,index)=>{link.href=links[index];link.setAttribute("aria-disabled",String(links[index]==="#"));})}).catch(()=>{});'''
          new='''fetch("content.json",{cache:"no-store"}).then(r=>r.ok?r.json():{}).then(content=>{const links=[content.resources?.syllabi?.welding1||"contact.html",content.resources?.syllabi?.welding2||"contact.html"];document.querySelectorAll("[data-syllabus]").forEach((link,index)=>{link.href=links[index];link.removeAttribute("aria-disabled");})}).catch(()=>{document.querySelectorAll("[data-syllabus]").forEach(link=>{link.href="contact.html";link.removeAttribute("aria-disabled")})});'''
          if old not in s: raise SystemExit('syllabi script target missing')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          # Use the current official Wilco address wording everywhere in editable/public source.
          for p in list(Path('.').glob('*.html'))+[Path('content.json')]:
              s=p.read_text(encoding='utf-8')
              s=s.replace('500 Wilco Drive', '500 Wilco Blvd.').replace('500 Wilco Blvd..', '500 Wilco Blvd.')
              p.write_text(s,encoding='utf-8')

          # Permanent release safeguards and recovery notes.
          Path('.github/workflows/validate.yml').write_text('''name: Validate site\non:\n  push:\n    branches: [main]\n  pull_request:\npermissions:\n  contents: read\njobs:\n  validate:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n          cache: npm\n      - run: npm ci --ignore-scripts\n      - run: node --check script.js\n      - run: for f in api/*.js lib/*.js; do node --check "$f"; done\n      - run: python -m json.tool content.json >/dev/null\n''',encoding='utf-8')
          Path('PUBLISHING.md').write_text('''# Wilco Welding publishing and recovery\n\n- Admin saves write to GitHub first. A successful admin message means the repository save completed; Vercel deployment is a separate step.\n- Before major edits, verify the latest Vercel production deployment is green.\n- If an editor reports a revision conflict, reload instead of retrying the stale form.\n- If a deployment fails, use Vercel Deploy Logs to identify the failed commit and fix or revert that commit in GitHub.\n- The full-page editor is for template-level changes. Fields controlled by `content.json` should be changed through their specialized admin screens.\n- Image uploads allow JPG, PNG, WebP, and GIF up to 10 MB.\n- Keep `ADMIN_PASSWORD`, `GITHUB_TOKEN`, and Blob credentials only in Vercel environment variables.\n''',encoding='utf-8')
          PY

          npm install --package-lock-only --ignore-scripts
          node --check script.js
          for f in api/*.js lib/*.js; do node --check "$f"; done
          python -m json.tool content.json >/dev/null

      - name: Commit final fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api content.json *.html package-lock.json PUBLISHING.md .github/workflows/validate.yml
          git commit -m "Finish review remediation and add release safeguards"
          git push
