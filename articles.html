<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Articles | Wilco Welding</title><meta name="description" content="Welding articles, student stories and program updates from Wilco Welding.">
<link rel="canonical" href="https://www.wilcowelding.org/articles.html">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffc400;--ink:#111827}*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:var(--ink);font:16px/1.6 Roboto,Arial,sans-serif}header{background:#050505;border-bottom:3px solid var(--gold)}nav{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 24px;flex-wrap:wrap}nav a{color:#fff;text-decoration:none;font:600 18px Oswald,Arial,sans-serif}nav .brand{font-size:28px}nav .brand span,nav a:hover{color:var(--gold)}nav .links{display:flex;gap:22px;flex-wrap:wrap}.hero{background:#161b25;color:#fff;padding:65px 24px;text-align:center}.hero h1{font:700 clamp(36px,6vw,60px) Oswald,sans-serif;margin:0;text-transform:uppercase}.hero p{color:#d1d5db;max-width:650px;margin:12px auto 0}.container{max-width:1150px;margin:45px auto 75px;padding:0 24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:25px}.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 8px 25px #11182713;border:1px solid #e1e5ec}.card img{width:100%;height:215px;object-fit:cover}.card-content{padding:22px}.meta{font-size:13px;color:#687384}.card h2{font:600 26px/1.2 Oswald,sans-serif;margin:10px 0}.card p{color:#536070}.card button,.back{border:0;background:#111827;color:#fff;padding:11px 17px;border-radius:6px;font-weight:700;cursor:pointer}.card button:hover,.back:hover{background:#a76700}.reader{background:#fff;max-width:850px;margin:auto;padding:clamp(24px,5vw,60px);border-radius:12px;box-shadow:0 8px 25px #11182712}.reader h1{font:700 clamp(30px,5vw,48px)/1.15 Oswald,sans-serif}.reader img{width:100%;max-height:460px;object-fit:cover;border-radius:9px;margin:18px 0}.article-body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85}.empty{text-align:center;color:#687384;padding:50px}footer{text-align:center;padding:25px;color:#647084;font-size:13px}
</style></head><body>
<header><nav><a class="brand" href="index.html">WILCO <span>WELDING</span></a><div class="links"><a href="index.html">HOME</a><a href="blog.html">BLOG</a><a href="articles.html" aria-current="page">ARTICLES</a><a href="alumni.html">ALUMNI</a></div></nav></header>
<section class="hero"><h1>Welding Articles</h1><p>Explore student stories, welding techniques, shop projects, and news from Wilco Welding.</p></section>
<main class="container"><div id="articles" class="grid"></div><div id="reader" hidden></div><p id="empty" class="empty">Loading articles…</p></main>
<footer>All work and design was made by Evan Margalus</footer>
<script>
let articles=[];
const list=document.getElementById("articles"),reader=document.getElementById("reader"),empty=document.getElementById("empty");
function el(tag,cls,value){const x=document.createElement(tag);if(cls)x.className=cls;if(value!==undefined)x.textContent=value;return x}
function view(id){const a=articles.find(x=>x.id===id);if(!a)return;list.hidden=true;empty.hidden=true;reader.hidden=false;reader.replaceChildren();const box=el("article","reader");const back=el("button","back","← All Articles");back.onclick=()=>{history.pushState(null,"",location.pathname);render()};box.append(back,el("h1","",a.title),el("p","meta",[a.author,a.date].filter(Boolean).join(" • ")));if(a.image){const img=el("img");img.src=a.image;img.alt=a.title;box.append(img)}box.append(el("div","article-body",a.body));reader.append(box);history.replaceState(null,"","#"+encodeURIComponent(id));window.scrollTo(0,0)}
function render(){reader.hidden=true;list.hidden=false;list.replaceChildren();empty.hidden=articles.length>0;if(!articles.length)empty.textContent="No articles have been published yet.";for(const a of articles){const card=el("article","card");if(a.image){const img=el("img");img.src=a.image;img.alt=a.title;img.loading="lazy";card.append(img)}const c=el("div","card-content");c.append(el("div","meta",[a.author,a.date].filter(Boolean).join(" • ")),el("h2","",a.title),el("p","",a.summary||a.body.slice(0,180)+"…"));const btn=el("button","","Read Article");btn.onclick=()=>view(a.id);c.append(btn);card.append(c);list.append(card)}const id=decodeURIComponent(location.hash.slice(1));if(id)view(id)}
fetch("content.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{articles=Array.isArray(data.articles)?data.articles:[];render()}).catch(()=>{empty.textContent="Articles are temporarily unavailable."});
window.addEventListener("popstate",()=>{if(location.hash){view(decodeURIComponent(location.hash.slice(1)))}else render()});
</script></body></html>
